    what: PySpark ETL over 410M rows, point-in-time features, no future data
    proof: [["src/features/build.py", "src/features/build.py"], ["ADR-001", "docs/adr/ADR-001-task-framing.md"]]
  - group: Machine learning
    what: LightGBM, LambdaMART ranking, self-supervised sequence encoders
    proof: [["ADR-003", "docs/adr/ADR-003-behaviour-encoder.md"], ["ADR-004", "docs/adr/ADR-004-ranking-and-calibration.md"]]
  - group: Statistics and evaluation
