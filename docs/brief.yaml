# At-a-glance brief (rule R22). Edit here only; `python scripts/brief.py` writes it into README.md, docs/index.html and docs/build.html.
repo_url: https://github.com/sabrinapribadi/subscription-churn-at-scale
brief:
  - w: What
    lines:
      - "A churn early warning for a music-subscription retention team: risk, reasons, who to call first, and a planning agent."
  - w: Why
    lines:
      - Churn shows only after renewal fails; a warning 14 days earlier lets the team act. Today's rule calls only manual renewers.
  - w: Who
    lines:
      - "Users: retention managers and call agents."
      - "Data: public KKBox (WSDM Cup 2018), 410M listening records, 6.8M members. Churner: no renewal within 30 days of expiry."
  - w: Where
    lines:
      - "[Results page](https://sabrinapribadi.github.io/subscription-churn-at-scale/) and [technical walkthrough](https://sabrinapribadi.github.io/subscription-churn-at-scale/build.html) on GitHub Pages; monthly job, registry and dashboard on Databricks; [demo API and MCP](https://subscription-churn-at-scale.vercel.app/docs) on Vercel."
  - w: When it fails
    lines:
      - 8 phases with pass bars set before training; 3 failed and are reported (label rebuild, listening embeddings, learned ranker).
      - "No live A/B test: historical data only. Tests are out-of-time (train February, score March); a live call test is the next step."
  - w: How
    lines:
      - LightGBM on point-in-time features, calibrated, ranked by churn chance × member value; 5 alternatives tried and rejected.
      - "Result: calling the top 10% reaches 65% of churners, vs 54% for today's rule; worth ≈12.4M a month after call costs."
skills:
