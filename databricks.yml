# Databricks Asset Bundle for P6 (ADR-008): the same pipeline as local, on serverless compute.
#   databricks bundle validate -p portfolio
#   databricks bundle deploy   -p portfolio
#   databricks bundle run churn_p6 -p portfolio
# The workspace comes from the CLI profile, so no workspace URL is stored in the repo.
bundle:
  name: subscription-churn-at-scale

sync:
  exclude:
    - docs/**
    - tests/**
    - "*.db"

variables:
  warehouse_id:
    description: SQL warehouse for the dashboard, looked up by name (no IDs in the repo)
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    mode: development
    default: true

resources:
  jobs:
    churn_p6:
      name: churn-p6-reproduce
      description: Build k=14, W=30 features with PySpark, retrain the champion, check parity with the local build, register it in Unity Catalog, check drift, publish result tables.
      max_concurrent_runs: 1
      schedule:                     # monthly, after outcomes for the previous month mature (ADR-009)
        quartz_cron_expression: "0 0 6 5 * ?"
        timezone_id: UTC
        pause_status: PAUSED        # Free Edition quota: run on demand
      tasks:
        - task_key: build_features
          environment_key: spark
          spark_python_task:
            python_file: scripts/build_dataset.py
            parameters: ["--months", "201702", "201703", "--W", "30"]
        - task_key: train_register
          depends_on:
            - task_key: build_features
          environment_key: ml
          spark_python_task:
            python_file: scripts/databricks_train_register.py
        - task_key: monitor_drift
          depends_on:
            - task_key: train_register
          environment_key: ml
          spark_python_task:
            python_file: scripts/monitor_drift.py
        - task_key: publish_tables
          depends_on:
            - task_key: monitor_drift
          run_if: ALL_DONE            # publish whatever exists, even if the gate failed
          environment_key: spark
          spark_python_task:
            python_file: scripts/databricks_publish_tables.py
      environments:
        - environment_key: spark
          spec:
            environment_version: "6"
            dependencies:
              - pyyaml
        - environment_key: ml
          spec:
            environment_version: "6"
            dependencies:            # pinned to the local versions that produced P4
              - lightgbm==4.7.0
              - scikit-learn==1.9.1
              - mlflow==3.17.0
              - pyyaml

  dashboards:
    churn_monthly:
      display_name: "Churn: monthly call list and model health"
      file_path: ./dashboards/churn_monthly.lvdash.json
      warehouse_id: ${var.warehouse_id}
