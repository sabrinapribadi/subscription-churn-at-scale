name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-serving.txt
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - run: pip install -r requirements-ci.txt ruff
      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 src scripts tests
      - name: Hiring-team brief in sync with docs/brief.yaml (R22)
        run: python scripts/brief.py --check
      - name: Unit, Spark, contract, GenAI and MCP tests (P5 gate)
        env: { CHURN_JAVA_HOME: "${{ env.JAVA_HOME }}" }
        run: pytest tests/ -q
      - name: LLM evaluation set (template provider; no API key in CI)
        run: python scripts/llm_eval.py
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the serving image
        run: docker build -t churn-serving .
      - name: Image imports every service
        run: docker run --rm churn-serving python -c "import src.services.apps, src.gateway.mcp_server, src.genai.explain; print('ok')"


  # R10/R19: the pages' browser tests in real Chrome (desktop light, dark, phone 400 px); a failure blocks publishing.
  browser:
    runs-on: ubuntu-latest
    env:
      NODE_PATH: /tmp/pt/node_modules
      CHROME_ARGS: --no-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-save --prefix /tmp/pt puppeteer-core@23.11.1
      - run: echo "CHROME_PATH=$(which google-chrome)" >> "$GITHUB_ENV"
      - run: node tests/browser/hover_test.js "$PWD/docs/index.html" /tmp
      - run: node tests/browser/controls_test.js "$PWD/docs/index.html" /tmp/links.txt "$PWD/data/outputs/p4_rank_calibrate.json"
      - run: node tests/browser/build_test.js "$PWD/docs/build.html" /tmp

  # R19: GitHub Pages deploy from main by workflow, only after unit and browser tests pass.
  pages:
    needs: [tests, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - id: deploy
        uses: actions/deploy-pages@v4

  # CD (R19, ADR-010): build the public demo bundle, sign its provenance, deploy to Vercel Hobby, smoke-test the live URL.
  # Skips the deploy (job stays green) until the VERCEL_TOKEN secret exists.
  deploy:
    needs: [tests, image, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # signs the build provenance
      attestations: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Build the bundle (light serving code, checksummed snapshot)
        run: |
          python scripts/build_deploy.py --out build/subscription-churn-at-scale
          tar -czf build/subscription-churn-at-scale.tar.gz -C build subscription-churn-at-scale
      - name: Sign build provenance
        uses: actions/attest-build-provenance@v4
        with: {subject-path: build/subscription-churn-at-scale.tar.gz}
      - uses: actions/upload-artifact@v4
        with: {name: deploy-bundle, path: build/subscription-churn-at-scale.tar.gz}
      - name: Deploy to Vercel (production)
        if: env.VERCEL_TOKEN != ''
        id: vercel
        working-directory: build/subscription-churn-at-scale
        run: echo "url=$(npx -y vercel@65.4.0 deploy --prod --yes --token "$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
      - name: Smoke test the live URL
        if: env.VERCEL_TOKEN != ''
        run: python scripts/smoke_test.py "${{ vars.PUBLIC_URL || steps.vercel.outputs.url }}"
      - name: No token yet
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::VERCEL_TOKEN not set; bundle built and attested, deploy skipped."
