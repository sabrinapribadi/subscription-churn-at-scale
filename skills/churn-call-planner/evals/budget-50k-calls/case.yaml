schema_version: "1.1"
name: budget-50k-calls
expected_outcome: |
  Opens with the data line; turns 50,000 calls into a share of the 862,158-member cohort (about 5.8%); gives the call-list forecast at save rate 25% and NT$15 per call; compares with the best share from the profit curve and the backtest; states a confidence level (medium) with its evidence (forecast reads low in March 2017; best shares 18% at half the save rate, 26% forecast, 34% backtest); turns it into a floor to commit to, the break-even save rate and a pilot of about 600 calls; says save rate and cost are the user's assumptions; provides the profit line chart.
