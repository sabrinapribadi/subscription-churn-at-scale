schema_version: "1.1"
name: budget-50k-calls
expected_outcome: |
  Opens with the data line; turns 50,000 calls into a share of the 862,158-member cohort (about 5.8%); gives the call-list forecast at save rate 25% and NT$15 per call; compares with the best share from the profit curve and the backtest; says how sure in numbers (3 of 3 views say calling more pays; they stop at 18%, 26% and 34%; forecast reads low in March 2017); turns it into a floor to commit to, the break-even save rate and a pilot of about 600 calls; says save rate and cost are the user's assumptions; provides the confidence page (dot plot, pilot simulation, decision flow).
