# ============================================================
# Default configuration — subscription-churn-at-scale
# ============================================================

# ----- Paths (raw data stays outside the repo and cloud-synced folders) -----
paths:
  raw_dir: ~/data/kkbox/raw
  parquet_dir: ~/data/kkbox/parquet
  cohorts_dir: ~/data/kkbox/cohorts
  features_dir: ~/data/kkbox/features
  serving_dir: ~/data/kkbox/serving        # model.txt + calibration.json (ADR-005)
  outputs_dir: data/outputs          # small, committed artefacts only

# ----- Task framing (ADR-001) -----
framing:
  lead_days: 14                      # k: predict at expiry − k days
  lead_days_grid: [7, 14, 30]
  window_days: 120                   # W used by P1 (kept for reproducibility)
  window_days_selected: 30           # P2 result: flat beyond 30 days (ADR-001 Am. 3); used from P3 on
  window_days_grid: [30, 60, 90, 120, 180]
  churn_grace_days: 30               # official WSDM definition

# ----- Validation (ADR-002) -----
validation:
  split: out_of_time                 # by expiry cohort, never random rows
  primary_metric: pr_auc
  top_k_fraction: 0.10
  gates:
    label_agreement_min: 0.99        # P0
    embedding_pr_auc_gain_min: 0.02  # P3

# ----- Business assumptions for profit@k (ADR-002) — varied in a sensitivity table -----
business:
  save_rate: 0.20                    # share of contacted churners retained (assumption, central case)
  contact_cost: 20.0                 # cost per contact, same currency as plan prices (assumption, central case)
  save_rate_grid: [0.10, 0.20, 0.30] # sensitivity (ADR-004)
  contact_cost_grid: [0, 20, 50]
  value_horizon_days: 365            # member value = paid per day × 365 (ADR-004)

# ----- Spark -----
spark:
  app_name: churn-at-scale
  driver_memory: 8g
  sample_fraction: 0.10              # dev sample of members; 1.0 for full runs

# ----- LLM (ADR-006; cost and latency per portfolio rule R13) -----
llm:
  provider: openai                   # used only when OPENAI_API_KEY is set; otherwise the template provider
  model: gpt-6-luna
  max_output_tokens: 160
  temperature: null                  # gpt-6-luna rejects temperature; set a number only for models that accept it
  reasoning_effort: none             # reasoning tokens use up max_output_tokens and cut notes off mid-sentence
  timeout_seconds: 8
  # USD per 1M tokens, from developers.openai.com/api/docs/pricing (read 2026-10-12)
  price_input_per_m: 0.10
  price_cached_input_per_m: 0.01
  price_output_per_m: 0.50
  budget_cost_per_1000: 0.20         # USD
  budget_p95_ms_live: 2000
  budget_p95_ms_cached: 50

# ----- Retention planner agent (ADR-007; budgets set before the first live run, rule R13) -----
agent:
  model: gpt-6-luna                  # same model as the note writer until the evaluation says otherwise
  reasoning_effort: none
  max_steps: 4                       # LLM rounds per question, tool calls included
  max_output_tokens: 400
  timeout_seconds: 20
  budget_cost_per_1000: 1.00         # USD per 1,000 questions, including nested note-writer calls
  budget_p95_ms: 8000                # a question takes 2-3 round trips at ~2 s each
  gate_task_success: 0.80            # live evaluation, reported in the ADR
