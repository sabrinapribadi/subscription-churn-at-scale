# Theme for the Streamlit companion app (R26). Dark by default, like the portfolio's featured apps: LinkedIn's preview
# is an automatic screenshot of the first screen, so the KPI strip and a chart must be visible there.
[theme]
base = "dark"
primaryColor = "#4d94e8"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
linkColor = "#7fb2f0"
borderColor = "#2a3240"
codeBackgroundColor = "#161b22"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
baseRadius = "0.75rem"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = true
metricValueFontSize = "2rem"
metricValueFontWeight = 700
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70"]

[theme.sidebar]
backgroundColor = "#11161e"
secondaryBackgroundColor = "#1a212c"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
